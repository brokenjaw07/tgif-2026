<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGIF '26</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    --cream:#fff4e3; --paper:#fffaf2; --ink:#2b1a12; --soft:#7a5a48;
    --pink:#ff3d7f; --orange:#ff7a00; --yellow:#ffc93c; --teal:#00a99d; --green:#3fae49; --purple:#8a3ffc; --red:#e63946; --blue:#1e88e5;
    --display:"Bowlby One","Arial Black",Impact,sans-serif;
    --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--cream);color:var(--ink);font:600 15px/1.45 var(--body);padding:0 0 calc(32px + env(safe-area-inset-bottom));
    background-image:radial-gradient(circle at 12px 12px, rgba(255,122,0,.10) 2px, transparent 2.5px);background-size:24px 24px}
  .wrap{padding:0 16px}

  /* papel picado banner */
  .picado{display:flex;gap:4px;padding:0 6px;position:relative;height:58px;overflow:hidden}
  .picado::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:#6b4a36}
  .flag{flex:1;min-width:30px;margin-top:7px;height:46px;clip-path:polygon(0 0,100% 0,100% 78%,85% 100%,70% 80%,50% 100%,30% 80%,15% 100%,0 78%);
    -webkit-mask:radial-gradient(circle at 50% 38%, transparent 5px, #000 5.5px) , linear-gradient(#000,#000);
    -webkit-mask-composite:source-in;mask-composite:intersect;transform-origin:top center;animation:sway 3.2s ease-in-out infinite}
  .flag:nth-child(odd){animation-delay:-1.4s}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

  header{text-align:center;padding:6px 16px 4px}
  h1{font-family:var(--display);font-weight:400;font-size:52px;line-height:.95;margin:6px 0 2px;color:var(--orange);
    text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink);letter-spacing:1px}
  .tag{font-family:var(--display);font-weight:400;color:var(--teal);font-size:17px;margin:8px 0 10px;letter-spacing:.5px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}

  h2{font-family:var(--display);font-weight:400;font-size:20px;margin:24px 0 10px;display:flex;gap:8px;align-items:center}
  h2 small{font-family:var(--body);font-size:12px;color:var(--soft);font-weight:700;margin-left:auto}

  /* timeline */
  .times{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .times::-webkit-scrollbar{display:none}
  .time{flex:none;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);width:150px}
  .time b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
  .time span{font-size:13px}

  /* map */
  .mapcard{border:2.5px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;
    background:linear-gradient(180deg,#ffe0b0 0%,#ffc2a8 55%,#f7a8c2 100%)}
  .mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mapscroll::-webkit-scrollbar{display:none}
  .mapinner{position:relative;width:900px;height:318px}
  .mapinner img{position:absolute;left:0;top:44px;width:900px;height:270px;display:block;user-select:none;-webkit-user-drag:none}
  .pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;animation:bob 2.4s ease-in-out infinite}
  .pin .ico{width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--c);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .pin .tail{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--c);margin-top:-1px}
  .pin .lbl{position:absolute;top:100%;margin-top:2px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .pin:nth-child(3n){animation-delay:-.8s} .pin:nth-child(3n+1){animation-delay:-1.6s}
  @keyframes bob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 5px))}}
  .maphint{display:flex;justify-content:space-between;padding:8px 12px;background:var(--paper);border-top:2.5px solid var(--ink);font-size:12.5px;font-weight:800}

  /* stations */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:12px;box-shadow:3px 3px 0 var(--ink);
    display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:transform .12s}
  .card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .card::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--c);opacity:.22}
  .card .em{font-size:30px;line-height:1}
  .card b{font-size:15px;line-height:1.2}
  .card small{font-size:12px;color:var(--soft);font-weight:700}

  footer{text-align:center;color:var(--soft);font-weight:800;font-size:13px;margin:28px 0 0}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(43,26,18,.45);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;border-top:3px solid var(--ink);
    transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1.15),visibility .28s;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sheet.open{transform:none;visibility:visible}
  .shead{background:var(--c);color:#fff;padding:18px 18px 16px;position:relative}
  .shead .em{font-size:40px;line-height:1}
  .shead h3{font-family:var(--display);font-weight:400;font-size:26px;margin:6px 0 2px;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .shead .where{font-weight:800;opacity:.95}
  .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
  .steps{list-style:none;margin:0;padding:16px 18px 4px;display:grid;gap:10px;counter-reset:s}
  .steps li{display:flex;gap:10px;align-items:flex-start;counter-increment:s}
  .steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
  .links{padding:8px 18px 0;display:flex;flex-wrap:wrap;gap:8px}
  .lk{border:2.5px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:9px 14px;font:800 14px var(--body);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
  .book{margin:14px 18px 0;border:2.5px solid var(--ink);border-radius:16px;padding:12px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
  .book h4{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 2px}
  .book .sub{font-size:12.5px;color:var(--soft);margin:0 0 10px}
  .slot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1.5px dashed #e6d3bd}
  .slot .t{font-weight:900}
  .slot .meta{font-size:12.5px;color:var(--soft)}
  .slot .who{grid-column:1/-1;font-size:12px;color:var(--soft)}
  .slot.mine{background:color-mix(in srgb,var(--c) 12%,#fff);margin:0 -12px;padding:10px 12px;border-radius:10px}
  .sb{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font:800 13px var(--body);background:var(--c);color:#fff;cursor:pointer}
  .sb.ghost{background:#fff;color:var(--ink)}
  .sb:disabled{opacity:.45;cursor:default}
  .picker{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px}
  .step{display:flex;align-items:center;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
  .step button{border:0;background:#fff;width:34px;height:32px;font:900 18px var(--body);cursor:pointer}
  .step span{min-width:30px;text-align:center;font-weight:900}
  .bmsg{font-size:13px;font-weight:800;margin-top:8px}
  .bmsg.err{color:var(--red)} .bmsg.ok{color:var(--green)}
  .lk.big{display:block;width:100%;margin-top:12px;font-size:15px;padding:12px}
  button:focus-visible,.card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.flag,.pin{animation:none}}
</style>
</head>

         "Keep it tight and even until it fits around your wrist",
         "Tie a knot at the end, then tie the two ends together on your wrist",
         "Make 2 and give one to someone you met tonight 🫶"],
    links:[{ t:"Step-by-step with photos", u:"https://www.instructables.com/id/-DIY-Braided-Bracelet-quick-easy-how-to-tutorial/" },
           { t:"More easy styles", u:"https://www.lovecrafts.com/blogs/articles/how-to-make-friendship-bracelets" }] },
  { id:"jagua", em:"🎨", name:"Jagua tattoo", where:"Loft, next to the bracelets", c:"#1e6fd0",
    how:["$1.50 small / $3 big. Pick a design, crew draws it on",
         "Let the gel dry completely and don't touch it",
         "Leave the gel on for about 2.5 to 4 hours, then rinse with lukewarm water, no soap",
         "It looks light at first and turns dark blue over 24 to 36 hours",
         "Avoid long showers, swimming and lotion for the first day or two",
         "Lasts about 1 to 2 weeks. It does NOT wash off, so choose your spot wisely (school?)"],
    links:[{ t:"Aftercare guide", u:"https://www.temporalis.tattoo/blogs/tips-tricks/jagua-tattoo-aftercare" }] },
  { id:"bdz", em:"💎", name:"Bedazzling", where:"Loft, long table next to the yard seating", c:"#c2185b",
    how:["Bring something to bedazzle: phone case, cap, water bottle, laptop sticker...",
         "Plan your design first (initials, hearts, a cactus 🌵)",
         "Put a tiny dot of glue, then press the gem on. Small dots, or it gets messy",
         "Leave it to dry before you touch or pack it. Ask crew how long for the glue we're using",
         "Show it off in the photobooth after 📸"], links:[] },
  { id:"stage", em:"🕺", name:"Limbo + pin the donkey", where:"Loft, in front of the screen", c:"#8a3ffc",
    how:["Limbo: bend backwards and get under the stick without touching it or the floor with your hands",
         "Every round the stick goes lower. Last one standing wins",
         "Pin the donkey: blindfold on, crew spins you 3 times, stick the tail on the donkey",
         "Closest tail wins bragging rights"], links:[] },
  { id:"granny", em:"👵", name:"Mexican Granny", where:"Haven", c:"#00a99d",
    how:["Granny sits in the middle wearing a sombrero",
         "Everyone tries to snatch the sombrero",
         "If Granny tags you, you're out for that round",
         "Whoever gets the sombrero becomes the next Granny",
         "Proper shoes or socks only, no slippers. The game master's call is final",
         "8PM: everyone comes here for the piñatas 🪅"], links:[] },
  { id:"game", em:"🎮", name:"Gaming room", where:"Haus 2", c:"#1e88e5",
    how:["PS5 on the wall TV, Switch on the trolley TV", "Write your name on the sign-up sheet by the door", "About 15 minutes per turn so everyone gets a go"], links:[] },
  { id:"ktv", em:"🎤", name:"KTV room", where:"Haus 1", c:"#d63aa1",
    how:["Search the song on YouTube on the TV (add 'karaoke' to the search)", "Pass the mic around, everyone sings", "Wait for the song to end before switching"], links:[] },
  { id:"pb", em:"📸", name:"Photobooths", where:"Meeting Room 1 + Meeting Room 2", c:"#ff3d7f",
    how:["2 photobooths, one in each meeting room", "Grab some props and your friends", "Phone on the tripod with the ring light, use the timer", "Ask crew about photo strips"], links:[] },
];
const BOOKING_API = ""; // paste your Google Apps Script Web app URL here (ends in /exec). Leave "" to hide booking.
const BOOKABLE = { ktv:"KTV", granny:"Granny" }; // station id : room name in the Slots tab
const FLOORPLAN_URL = "https://brokenjaw07.github.io/tgif-2026/TGIF_Hub_FloorPlan.html";
const PINS = {"bdz": [[76.7, 40.0]], "reg": [[59, 52.8]], "food": [[63.7, 14.4]], "drinks": [[52.6, 17.5]], "brace": [[77.4, 17.8]], "jagua": [[82.9, 17.8]], "stage": [[85, 32.5]], "granny": [[15.6, 32.5]], "game": [[28.6, 44.4]], "ktv": [[44.6, 44.4]], "chill": [[63.6, 42.9], [87.6, 50.8]], "pb": [[33.1, 15.4], [43.2, 15.4]]}; // where each station's pin sits on the map picture, [% from left, % from top]
const SHORT = { reg:"Register", food:"Food", drinks:"Drinks", chill:"Chill", pb:"Photobooth", brace:"Bracelets", jagua:"Jagua", stage:"Limbo", lounge:"Chill", bdz:"Bedazzle", granny:"Granny", game:"Gaming", ktv:"KTV", pb2:"Photobooth", pb1:"Photobooth" };

/* ============ BUILD THE PAGE ============ */
const $ = id => document.getElementById(id);
const tg = window.Telegram && window.Telegram.WebApp;

// papel picado flags
const flagCols = ["#ff3d7f","#ff7a00","#ffc93c","#3fae49","#00a99d","#1e88e5","#8a3ffc","#e63946"];
for (let i = 0; i < 12; i++){ const f = document.createElement("div"); f.className = "flag"; f.style.background = flagCols[i % flagCols.length]; $("picado").appendChild(f); }

// pins on the map
STATIONS.forEach(s => { (PINS[s.id] || []).forEach(p => {
  const b = document.createElement("button"); b.className = "pin"; b.style.setProperty("--c", s.c);
  b.style.left = p[0] + "%"; b.style.top = (44 + p[1] * 2.7) + "px"; // 44px space above the picture, picture is 270px tall
  b.setAttribute("aria-label", s.name);
  b.innerHTML = `<span class="ico"></span><span class="tail"></span><span class="lbl"></span>`;
  b.querySelector(".ico").textContent = s.em; b.querySelector(".lbl").textContent = SHORT[s.id] || s.name;
  b.addEventListener("click", () => openSheet(s)); $("mapinner").appendChild(b); }); });
// start the map on the Loft (where most stations are)
requestAnimationFrame(() => { const m = $("mapscroll"); m.scrollLeft = (m.scrollWidth - m.clientWidth) * 0.72; });

// station cards
STATIONS.forEach(s => { const c = document.createElement("button"); c.className = "card"; c.style.setProperty("--c", s.c);
  c.innerHTML = `<span class="em"></span><b></b><small></small>`;
  c.querySelector(".em").textContent = s.em; c.querySelector("b").textContent = s.name; c.querySelector("small").textContent = "📍 " + s.where;
  c.addEventListener("click", () => openSheet(s)); $("grid").appendChild(c); });

// detail sheet
function openSheet(s){
  const sh = $("sheet"); sh.style.setProperty("--c", s.c); sh.innerHTML = "";
  const head = document.createElement("div"); head.className = "shead";
  head.innerHTML = `<div class="em"></div><h3 id="sTitle"></h3><div class="where"></div><button class="x" aria-label="Close">✕</button>`;
  head.querySelector(".em").textContent = s.em; head.querySelector("h3").textContent = s.name; head.querySelector(".where").textContent = "📍 " + s.where;
  head.querySelector(".x").addEventListener("click", closeSheet); sh.appendChild(head);
  const ol = document.createElement("ol"); ol.className = "steps"; s.how.forEach(t => { const li = document.createElement("li"); li.textContent = t; ol.appendChild(li); }); sh.appendChild(ol);
  if (BOOKING_API && BOOKABLE[s.id]){ const bk = document.createElement("div"); bk.className = "book"; sh.appendChild(bk); loadBooking(bk, BOOKABLE[s.id]); }
  const links = (s.links || []).slice();
  if (links.length){ const lw = document.createElement("div"); lw.className = "links";
    links.forEach(l => { const a = document.createElement("button"); a.className = "lk"; a.textContent = (l.t.startsWith("📅") ? "" : "🔗 ") + l.t;
      a.addEventListener("click", () => (tg && tg.openLink) ? tg.openLink(l.u) : window.open(l.u, "_blank")); lw.appendChild(a); }); sh.appendChild(lw); }
  sh.classList.add("open"); $("scrim").classList.add("open"); sh.scrollTop = 0;
  if (tg && tg.BackButton) tg.BackButton.show();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
}
/* ============ BOOKING (KTV + Granny) ============ */
async function api(action, extra){
  const r = await fetch(BOOKING_API, { method:"POST", body: JSON.stringify(Object.assign({ action, initData: (tg && tg.initData) || "" }, extra || {})) });
  const data = await r.json(); if (data.error) throw new Error(data.error); return data;
}
function loadBooking(box, room, msg, ok){
  box.innerHTML = `<h4>📅 Book a ${room} slot</h4><p class="sub">Booking for your group? Count yourself + everyone coming with you.</p><div class="list">Loading slots…</div>`;
  if (!(tg && tg.initData)){ box.querySelector(".list").textContent = "Open this inside the TGIF bot on Telegram to book."; return; }
  const done = d => renderBooking(box, room, d, msg, ok);
  api("list").then(done).catch(e => { box.querySelector(".list").textContent = "Couldn't load slots: " + e.message; });
}
function renderBooking(box, room, data, msg, ok){
  const list = box.querySelector(".list"); list.innerHTML = "";
  const mine = data.mine.find(b => b.room === room);
  const slots = data.slots.filter(s => s.room === room);
  if (!slots.length){ list.textContent = "No slots yet. Check back soon!"; }
  slots.forEach(s => {
    const row = document.createElement("div"); row.className = "slot" + (mine && mine.slot_id === s.id ? " mine" : "");
    row.innerHTML = `<div><div class="t"></div><div class="meta"></div></div><div class="act"></div><div class="who"></div>`;
    row.querySelector(".t").textContent = s.start + " – " + s.end;
    row.querySelector(".meta").textContent = mine && mine.slot_id === s.id ? `✅ You're in (${mine.people} ${mine.people > 1 ? "people" : "person"})` : (s.left ? `${s.left} of ${s.capacity} spots left` : "Full");
    row.querySelector(".who").textContent = s.groups.length ? "👥 " + s.groups.join(", ") : "";
    const act = row.querySelector(".act");
    if (mine && mine.slot_id === s.id){
      const c = document.createElement("button"); c.className = "sb ghost"; c.textContent = "Cancel";
      c.onclick = () => run(box, room, c, "cancel", { room }, "Cancelled. Your spots are free for others."); act.appendChild(c);
    } else if (!mine && s.left){
      const b = document.createElement("button"); b.className = "sb"; b.textContent = "Book";
      b.onclick = () => { row.querySelectorAll(".picker").forEach(x => x.remove()); let n = 1; const max = Math.min(s.left, s.capacity);
        const pk = document.createElement("div"); pk.className = "picker";
        pk.innerHTML = `<span style="font-size:13px;font-weight:800">People:</span><div class="step"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></div>`;
        const [minus, plus] = pk.querySelectorAll(".step button"), val = pk.querySelector(".step span");
        minus.onclick = () => { n = Math.max(1, n - 1); val.textContent = n; }; plus.onclick = () => { n = Math.min(max, n + 1); val.textContent = n; };
        const go = document.createElement("button"); go.className = "sb"; go.textContent = "Confirm";
        go.onclick = () => run(box, room, go, "book", { slotId: s.id, people: n }, `Booked! See you at ${s.start} 🎉`);
        pk.appendChild(go); row.appendChild(pk); };
      act.appendChild(b);
    } else {
      const d = document.createElement("button"); d.className = "sb ghost"; d.disabled = true; d.textContent = s.left ? "Book" : "Full"; act.appendChild(d);
    }
    list.appendChild(row);
  });
  if (mine) { const n = document.createElement("p"); n.className = "sub"; n.style.margin = "8px 0 0"; n.textContent = "One booking per person for each room. Cancel first if you want to switch."; list.appendChild(n); }
  if (msg){ const m = document.createElement("div"); m.className = "bmsg " + (ok ? "ok" : "err"); m.textContent = msg; list.appendChild(m); }
}
function run(box, room, btn, action, extra, okMsg){
  btn.disabled = true; btn.textContent = "…";
  api(action, extra)
    .then(d => { renderBooking(box, room, d, okMsg, true); if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); })
    .catch(e => { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); api("list").then(d => renderBooking(box, room, d, e.message, false)).catch(() => { btn.disabled = false; btn.textContent = "Try again"; }); });
}

function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); if (tg && tg.BackButton) tg.BackButton.hide(); }
$("scrim").addEventListener("click", closeSheet);
$("open3d").addEventListener("click", () => (tg && tg.openLink) ? tg.openLink(FLOORPLAN_URL) : window.open(FLOORPLAN_URL, "_blank"));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Telegram: ready, full height, colours, back button
if (tg){ tg.ready(); tg.expand();
  try { tg.setHeaderColor("#fff4e3"); tg.setBackgroundColor("#fff4e3"); } catch(e){}
  if (tg.BackButton) tg.BackButton.onClick(closeSheet); }
</script>
</body>
</html>
